[project]
name = "docx-rewrite-system"
version = "0.1.0"
description = "MVP he thong ho tro chinh sua DOCX dua tren bao cao tuong dong"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "python-docx>=1.1.2",
  "pymupdf>=1.24.0",
  "rapidfuzz>=3.9.0",
  "pydantic-settings>=2.5.2",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
